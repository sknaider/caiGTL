# ============================================
# TIER 1: AUTOMATED VULNERABILITY ASSESSMENT
# ============================================
tier_1_basic:
  name: "Automated Vulnerability Assessment"
  target_market: "Small logistics companies (1-50 employees)"

  pricing:
    setup_fee: 8000  # USD, one-time
    monthly_fee: 2000  # USD, recurring
    billing_cycle: monthly
    minimum_contract: 12  # months
    annual_discount: 10  # % discount for annual prepay

  includes:
    scanning:
      - "Weekly automated security scans"
      - "Network discovery (nmap)"
      - "Web vulnerability scanning (nuclei)"
      - "2 scans per month (configurable schedule)"
      - "Up to 3 target systems/networks"

    reporting:
      - "Vulnerability reports (PDF + HTML)"
      - "Spanish language reports"
      - "Executive summary included"
      - "CVSS scoring and prioritization"
      - "Remediation recommendations"

    alerting:
      - "Email alerts for critical findings"
      - "Weekly digest reports"
      - "30-day report retention"

    support:
      - "Email support (48-hour response SLA)"
      - "Knowledge base access"
      - "Monthly office hours (30 min)"
      - "Community forum access"

    compliance:
      - "Basic SUNAT compliance checks"
      - "Data encryption validation"

  limitations:
    max_scans_per_month: 8
    max_concurrent_scans: 1
    max_target_systems: 3
    api_rate_limit: "100 requests/minute"
    report_retention_days: 30
    custom_agents: false
    dedicated_support: false

  addons:
    additional_scan: 250  # USD per scan
    additional_target: 500  # USD per month per target
    extended_retention: 200  # USD per month (90 days)

