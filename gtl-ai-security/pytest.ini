[pytest]
# Pytest Configuration for GTL AI Security Platform

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require external services)
    slow: Slow-running tests
    asyncio: Asynchronous tests
    requires_tools: Tests that require scanning tools (nmap, nuclei, etc.)

# Asyncio mode
asyncio_mode = auto

# Coverage options (when running with --cov)
[coverage:run]
source = gtl_security_scanner, gtl_api_gateway
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Minimum coverage threshold
fail_under = 80

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Output
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
