version: '3.8'

# GTL AI Security Platform - Enterprise Production Deployment
# Includes: API Gateway, Threat Detector, Compliance Auditor, WAF, Monitoring, and more

x-common-variables: &common-variables
  ENVIRONMENT: production
  DATABASE_URL: postgresql+asyncpg://gtl_admin:${DATABASE_PASSWORD}@postgres:5432/gtl_security_prod
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
  SHODAN_API_KEY: ${SHODAN_API_KEY}
  VAULT_ENABLED: "true"
  VAULT_ADDR: http://vault:8200
  VAULT_TOKEN: ${VAULT_TOKEN}

services:
  # ===========================
  # Database Services
  # ===========================

  postgres:
    image: postgres:15-alpine
    container_name: gtl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gtl_security_prod
      POSTGRES_USER: gtl_admin
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - gtl-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtl_admin -d gtl_security_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID

  redis:
    image: redis:7-alpine
    container_name: gtl-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - gtl-backend
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # ===========================
  # Secrets Management
  # ===========================

  vault:
    image: hashicorp/vault:latest
    container_name: gtl-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN}
    volumes:
      - vault_data:/vault/data
      - ./config/vault:/vault/config:ro
    ports:
      - "127.0.0.1:8200:8200"
    networks:
      - gtl-backend
    command: server -dev
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8200/v1/sys/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================
  # GTL Core Services
  # ===========================

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: gtl-api
    restart: unless-stopped
    command: uvicorn gtl_api_gateway.main:app --host 0.0.0.0 --port 8000 --workers 4 --loop uvloop
    environment:
      <<: *common-variables
      WORKERS: 4
      MAX_REQUESTS: 1000
      MAX_REQUESTS_JITTER: 100
    volumes:
      - ./logs:/app/logs
      - scan_results:/app/scan_results
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - gtl-backend
      - gtl-frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 4g
    mem_reservation: 2g
    cpus: 2.0

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: gtl-celery-worker
    restart: unless-stopped
    command: celery -A gtl_security_scanner.scheduler worker --loglevel=info --concurrency=4 --max-tasks-per-child=100
    environment:
      <<: *common-variables
      C_FORCE_ROOT: "true"
    volumes:
      - ./logs:/app/logs
      - scan_results:/app/scan_results
    networks:
      - gtl-backend
    depends_on:
      - postgres
      - redis
      - api
    security_opt:
      - no-new-privileges:true
    mem_limit: 8g
    mem_reservation: 4g
    cpus: 4.0

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: gtl-celery-beat
    restart: unless-stopped
    command: celery -A gtl_security_scanner.scheduler beat --loglevel=info --pidfile=/tmp/celerybeat.pid
    environment:
      <<: *common-variables
    volumes:
      - ./logs:/app/logs
    networks:
      - gtl-backend
    depends_on:
      - postgres
      - redis
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 0.5

  celery_flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: gtl-celery-flower
    restart: unless-stopped
    command: celery -A gtl_security_scanner.scheduler flower --port=5555 --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    environment:
      <<: *common-variables
    ports:
      - "127.0.0.1:5555:5555"
    networks:
      - gtl-backend
      - gtl-frontend
    depends_on:
      - redis
      - celery_worker
    security_opt:
      - no-new-privileges:true

  threat_detector:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: gtl-threat-detector
    restart: unless-stopped
    command: python -m gtl_threat_detector.service
    environment:
      <<: *common-variables
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
    networks:
      - gtl-backend
    depends_on:
      - postgres
      - redis
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    mem_reservation: 2g
    cpus: 2.0

  compliance_auditor:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: gtl-compliance-auditor
    restart: unless-stopped
    command: python -m gtl_compliance_auditor.service
    environment:
      <<: *common-variables
    volumes:
      - ./logs:/app/logs
      - compliance_reports:/app/reports
    networks:
      - gtl-backend
    depends_on:
      - postgres
      - redis
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.0

  # ===========================
  # Web Application Firewall
  # ===========================

  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: gtl-waf
    restart: unless-stopped
    volumes:
      - ./waf/modsecurity_rules.conf:/etc/modsecurity.d/owasp-crs/custom_rules.conf:ro
      - ./waf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - waf_logs:/var/log/modsecurity
    ports:
      - "80:80"
      - "443:443"
    networks:
      - gtl-frontend
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

  # ===========================
  # Monitoring & Logging
  # ===========================

  prometheus:
    image: prom/prometheus:latest
    container_name: gtl-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - gtl-backend
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"

  grafana:
    image: grafana/grafana:latest
    container_name: gtl-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: redis-datasource,postgres-datasource
      GF_SERVER_ROOT_URL: https://grafana.gtl.pe
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - gtl-backend
      - gtl-frontend
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    user: "472:472"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: gtl-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - gtl-backend
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    mem_reservation: 2g

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: gtl-logstash
    restart: unless-stopped
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logs:/logs:ro
    networks:
      - gtl-backend
    depends_on:
      - elasticsearch
    security_opt:
      - no-new-privileges:true

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: gtl-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_BASEPATH: /kibana
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - gtl-backend
      - gtl-frontend
    depends_on:
      - elasticsearch
    security_opt:
      - no-new-privileges:true

  # ===========================
  # Dashboard Frontend
  # ===========================

  dashboard:
    build:
      context: ./gtl_dashboard
      dockerfile: Dockerfile
    container_name: gtl-dashboard
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: https://api.gtl.pe
      NODE_ENV: production
    ports:
      - "127.0.0.1:3001:80"
    networks:
      - gtl-frontend
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true

  # ===========================
  # Backup Service
  # ===========================

  backup:
    image: postgres:15-alpine
    container_name: gtl-backup
    restart: "no"
    environment:
      PGHOST: postgres
      PGDATABASE: gtl_security_prod
      PGUSER: gtl_admin
      PGPASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - gtl-backend
    depends_on:
      - postgres
    entrypoint: /bin/sh
    command: -c "/backup.sh && tail -f /dev/null"
    security_opt:
      - no-new-privileges:true

networks:
  gtl-backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  gtl-frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  vault_data:
    driver: local
  scan_results:
    driver: local
  compliance_reports:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
  waf_logs:
    driver: local
