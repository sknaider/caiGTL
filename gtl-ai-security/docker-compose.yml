version: "3.8"

services:
  # ========================================
  # PostgreSQL Database
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: gtl_postgres
    environment:
      POSTGRES_USER: gtl_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-gtl_password}
      POSTGRES_DB: gtl_security
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtl_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gtl_network

  # ========================================
  # Redis (Cache & Message Broker)
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: gtl_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gtl_network

  # ========================================
  # API Gateway (FastAPI)
  # ========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gtl_api
    command: uvicorn gtl_api_gateway.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql://gtl_user:${DATABASE_PASSWORD:-gtl_password}@postgres:5432/gtl_security
      - REDIS_URL=redis://redis:6379/0
      - CAI_MODEL=${CAI_MODEL:-alias0}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SHODAN_API_KEY=${SHODAN_API_KEY}
    volumes:
      - .:/app
      - scan_results:/app/scan_results
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gtl_network

  # ========================================
  # Celery Worker (Background Tasks)
  # ========================================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gtl_celery_worker
    command: celery -A gtl_security_scanner.scheduler worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://gtl_user:${DATABASE_PASSWORD:-gtl_password}@postgres:5432/gtl_security
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CAI_MODEL=${CAI_MODEL:-alias0}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - .:/app
      - scan_results:/app/scan_results
    depends_on:
      - redis
      - postgres
    networks:
      - gtl_network

  # ========================================
  # Celery Beat (Scheduler)
  # ========================================
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gtl_celery_beat
    command: celery -A gtl_security_scanner.scheduler beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - redis
    networks:
      - gtl_network

  # ========================================
  # Flower (Celery Monitoring)
  # ========================================
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gtl_flower
    command: celery -A gtl_security_scanner.scheduler flower --port=5555
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - gtl_network

  # ========================================
  # Nginx (Reverse Proxy)
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: gtl_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - gtl_network

volumes:
  postgres_data:
  redis_data:
  scan_results:

networks:
  gtl_network:
    driver: bridge
